<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yulya Studio | Creator Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070314;
      --panel: #0d0620;
      --panel-border: rgba(155, 89, 182, 0.3);
      --primary: #9b59b6;
      --cyan: #00f0ff;
      --pink: #ff007f;
      --green: #39ff14;
      --text: #ffffff;
      --muted: #8888aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Topbar */
    header {
      height: 60px;
      background: rgba(13, 6, 32, 0.95);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .logo {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .logo span {
      background: linear-gradient(135deg, var(--cyan), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .project-selector {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    select {
      background: #050110;
      border: 1px solid var(--panel-border);
      color: var(--cyan);
      padding: 6px 12px;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
    .btn {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      border: none;
      text-decoration: none;
    }
    .btn-sm { padding: 4px 10px; font-size: 0.8rem; }
    .btn-primary { background: linear-gradient(135deg, var(--pink), var(--primary)); color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); }
    .btn-outline:hover { background: rgba(0, 240, 255, 0.1); }
    .btn-danger { background: rgba(255, 51, 68, 0.2); border: 1px solid #ff3344; color: #ff8899; }
    .btn-danger:hover { background: rgba(255, 51, 68, 0.4); }

    /* Workspace Dual Pane */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }
    .pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--panel-border);
      overflow: hidden;
      background: var(--panel);
    }
    .pane:last-child {
      border-right: none;
    }
    .pane-header {
      height: 44px;
      background: rgba(7, 3, 20, 0.8);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .tabs {
      display: flex;
      gap: 4px;
    }
    .tab {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      cursor: pointer;
      background: transparent;
      border: none;
    }
    .tab.active {
      background: rgba(0, 240, 255, 0.15);
      color: var(--cyan);
      font-weight: 600;
    }
    .code-view {
      flex: 1;
      overflow: auto;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      color: #eee;
      white-space: pre-wrap;
      word-break: break-all;
      background: #050110;
    }
    .terminal-line {
      margin-bottom: 4px;
    }
    .term-info { color: var(--cyan); }
    .term-success { color: var(--green); }
    .term-thought { color: #d175ff; font-style: italic; }
    .term-warn { color: #ffcc00; }
    .term-err { color: #ff3344; }

    /* Preview Iframe */
    .preview-container {
      flex: 1;
      background: #000;
      position: relative;
      overflow: hidden;
    }
    .preview-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Bottom PTT Bar */
    .bottom-bar {
      height: 70px;
      background: rgba(13, 6, 32, 0.98);
      border-top: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      gap: 20px;
    }
    .ptt-btn {
      flex: 1;
      max-width: 400px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(255, 0, 127, 0.2), rgba(155, 89, 182, 0.2));
      border: 2px solid var(--pink);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .ptt-btn.active {
      background: linear-gradient(135deg, var(--pink), var(--primary));
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.8);
      transform: scale(0.98);
    }
    .text-input-box {
      flex: 1;
      display: flex;
      gap: 8px;
    }
    .text-input-box input {
      flex: 1;
      background: #050110;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 8px 14px;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      outline: none;
    }
    .text-input-box input:focus {
      border-color: var(--cyan);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="logo">🎮 <span>YULYA STUDIO</span></div>
      <div class="project-selector">
        <select id="projectSelect" onchange="switchProject(this.value)">
          {% for p in projects %}
            <option value="{{ p.slug }}" {% if p.slug == active_slug %}selected{% endif %}>{{ p.title or p.slug }}</option>
          {% endfor %}
        </select>
        <button class="btn btn-outline btn-sm" onclick="promptNewProject()">+ New Project</button>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <span style="font-size: 0.85rem; color: var(--muted);">👤 @{{ user.username }}</span>
      <button class="btn btn-danger btn-sm" onclick="leaveVC()">Leave VC 🚪</button>
    </div>
  </header>

  <div class="workspace">
    <!-- Left Pane: Code & Terminal -->
    <div class="pane">
      <div class="pane-header">
        <div class="tabs">
          <button class="tab active" onclick="showTab('terminal')">⚡ Terminal Logs</button>
          <button class="tab" onclick="showTab('index.html')">index.html</button>
          <button class="tab" onclick="showTab('style.css')">style.css</button>
          <button class="tab" onclick="showTab('app.js')">app.js</button>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 0.8rem;">
          <span id="connStatus" style="color: var(--green);">🟢 Gemini 3.8 Live</span>
        </div>
      </div>
      <div id="codeDisplay" class="code-view">
        <div class="terminal-line term-info">> [STUDIO] Initialized workspace for @{{ user.username }}.</div>
        <div class="terminal-line term-info">> [AI ARCHITECT] Gemini 3.8 Live Extended Thinking Online.</div>
        <div class="terminal-line term-thought">> Hold Spacebar to speak via Push-to-Talk or type below.</div>
      </div>
    </div>

    <!-- Right Pane: Game Preview -->
    <div class="pane">
      <div class="pane-header">
        <span style="font-size: 0.85rem; font-weight: 600; color: var(--cyan);">🕹️ Live Playable Canvas</span>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-outline btn-sm" onclick="restartGame()">🔄 Restart</button>
          <button class="btn btn-outline btn-sm" id="shareScreenBtn" onclick="toggleScreenShare()">🖥️ Share Screen</button>
          <button class="btn btn-outline btn-sm" onclick="downloadZip()">⬇️ Download ZIP</button>
          <button class="btn btn-primary btn-sm" onclick="copyPublicLink()">🔗 Share Game</button>
        </div>
      </div>
      <div class="preview-container">
        <iframe id="gameFrame" src="/{{ user.username }}/{{ active_slug }}/"></iframe>
      </div>
    </div>
  </div>

  <!-- Bottom PTT Bar -->
  <div class="bottom-bar">
    <button class="ptt-btn" id="pttBtn">
      <span id="pttIcon">🎙️</span>
      <span id="pttText">HOLD SPACEBAR TO TALK (PTT)</span>
    </button>
    <div class="text-input-box">
      <input type="text" id="commandInput" placeholder="Or type a prompt: e.g. 'Make player shoot lasers and add particles'..." onkeydown="if(event.key==='Enter') sendCommand()">
      <button class="btn btn-primary" onclick="sendCommand()">Send ⚡</button>
    </div>
  </div>

  <script>
    const USERNAME = "{{ user.username }}";
    let activeSlug = "{{ active_slug }}";
    let activeTab = 'terminal';
    let fileContents = {};
    let ws = null;
    let screenStream = null;
    let screenInterval = null;

    // Connect WebSocket
    function connectWS() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${window.location.host}/ws/studio?slug=${activeSlug}`);

      ws.onopen = () => {
        logTerminal('> WebSocket connection established.', 'term-info');
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'log') {
            logTerminal(data.message, data.cssClass || 'term-info');
          } else if (data.type === 'code_update') {
            logTerminal(`> [AI UPDATE] ${data.summary}`, 'term-success');
            fileContents = data.content || {};
            if (activeTab !== 'terminal') {
              showTab(activeTab);
            }
            restartGame();
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        document.getElementById('connStatus').innerText = '🔴 Disconnected';
        document.getElementById('connStatus').style.color = 'var(--pink)';
        setTimeout(connectWS, 3000);
      };
    }
    connectWS();

    function logTerminal(text, cssClass = 'term-info') {
      const term = document.getElementById('codeDisplay');
      if (activeTab !== 'terminal') return;
      const line = document.createElement('div');
      line.className = `terminal-line ${cssClass}`;
      line.innerText = text;
      term.appendChild(line);
      term.scrollTop = term.scrollHeight;
    }

    function showTab(tabName) {
      activeTab = tabName;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const activeBtn = Array.from(document.querySelectorAll('.tab')).find(b => b.innerText.includes(tabName));
      if (activeBtn) activeBtn.classList.add('active');

      const disp = document.getElementById('codeDisplay');
      if (tabName === 'terminal') {
        disp.innerHTML = '<div class="terminal-line term-info">> Terminal Logs active.</div>';
      } else {
        disp.innerText = fileContents[tabName] || `Loading ${tabName}...`;
        fetchFile(tabName);
      }
    }

    async function fetchFile(fname) {
      try {
        const res = await fetch(`/${USERNAME}/${activeSlug}/${fname}?t=${Date.now()}`);
        const text = await res.text();
        fileContents[fname] = text;
        if (activeTab === fname) {
          document.getElementById('codeDisplay').innerText = text;
        }
      } catch (e) {}
    }

    function restartGame() {
      const frame = document.getElementById('gameFrame');
      frame.src = `/${USERNAME}/${activeSlug}/?t=${Date.now()}`;
    }

    async function sendCommand() {
      const input = document.getElementById('commandInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      logTerminal(`> You: "${text}"`, 'term-info');
      logTerminal(`> [AI ARCHITECT] Processing changes with Gemini...`, 'term-thought');

      try {
        const res = await fetch('/api/modify-project', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug: activeSlug, prompt: text })
        });
        const data = await res.json();
        if (!data.success) {
          logTerminal(`> [ERROR] ${data.error}`, 'term-err');
        }
      } catch (e) {
        logTerminal(`> [ERROR] Network request failed.`, 'term-err');
      }
    }

    // Screenshare
    async function toggleScreenShare() {
      const btn = document.getElementById('shareScreenBtn');
      if (screenStream) {
        screenStream.getTracks().forEach(t => t.stop());
        screenStream = null;
        clearInterval(screenInterval);
        btn.innerText = '🖥️ Share Screen';
        btn.classList.remove('btn-primary');
        btn.classList.add('btn-outline');
        logTerminal('> [VISION] Screenshare stopped.', 'term-warn');
        return;
      }

      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { width: 1920, height: 1080 } });
        btn.innerText = '🛑 Stop Screenshare';
        btn.classList.remove('btn-outline');
        btn.classList.add('btn-primary');
        logTerminal('> [VISION] 1080p Screenshare active. Gemini 3.8 Live is seeing your screen.', 'term-success');

        const video = document.createElement('video');
        video.srcObject = screenStream;
        video.play();

        const canvas = document.createElement('canvas');
        canvas.width = 1280;
        canvas.height = 720;
        const ctx = canvas.getContext('2d');

        screenInterval = setInterval(() => {
          if (!screenStream || !ws || ws.readyState !== WebSocket.OPEN) return;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const base64 = canvas.toDataURL('image/jpeg', 0.65).split(',')[1];
          ws.send(JSON.stringify({ type: 'video_frame', data: base64 }));
        }, 1000); // 1 frame per second to conserve tokens while giving full visual reasoning

        screenStream.getVideoTracks()[0].onended = () => toggleScreenShare();
      } catch (err) {
        logTerminal(`> [VISION ERROR] ${err.message}`, 'term-err');
      }
    }

    // Push-to-Talk (PTT)
    let isPTT = false;
    let mediaRecorder = null;
    let audioStream = null;

    async function startAudioRecording() {
      try {
        if (!audioStream) {
          audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }
        mediaRecorder = new MediaRecorder(audioStream);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0 && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(e.data);
          }
        };
        mediaRecorder.start(100);
      } catch (e) {
        console.warn('Microphone permission not granted:', e);
      }
    }

    function stopAudioRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    const pttBtn = document.getElementById('pttBtn');

    function activatePTT() {
      if (isPTT) return;
      isPTT = true;
      pttBtn.classList.add('active');
      document.getElementById('pttText').innerText = '🔴 LISTENING... (RELEASE TO SEND)';
      startAudioRecording();
    }

    function deactivatePTT() {
      if (!isPTT) return;
      isPTT = false;
      pttBtn.classList.remove('active');
      document.getElementById('pttText').innerText = 'HOLD SPACEBAR TO TALK (PTT)';
      stopAudioRecording();
    }

    pttBtn.addEventListener('mousedown', activatePTT);
    pttBtn.addEventListener('mouseup', deactivatePTT);
    pttBtn.addEventListener('mouseleave', deactivatePTT);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT' && !e.repeat) {
        e.preventDefault();
        activatePTT();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        deactivatePTT();
      }
    });

    function downloadZip() {
      window.open(`/api/download-zip/${USERNAME}/${activeSlug}`, '_blank');
    }

    function copyPublicLink() {
      const url = `${window.location.origin}/${USERNAME}/${activeSlug}/`;
      navigator.clipboard.writeText(url);
      alert(`Public Game Link copied to clipboard:\n${url}`);
    }

    async function promptNewProject() {
      const name = prompt('Enter a name for your new game:');
      if (!name) return;
      const res = await fetch('/api/create-project', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: name })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = `/studio?slug=${data.slug}`;
      } else {
        alert(data.error || 'Failed to create project.');
      }
    }

    function switchProject(slug) {
      window.location.href = `/studio?slug=${slug}`;
    }

    async function leaveVC() {
      if (confirm('Leave Discord Voice Channel and end studio session?')) {
        await fetch('/api/leave-vc', { method: 'POST' });
        window.location.href = '/';
      }
    }
  </script>
</body>
</html>
