<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yulya Studio V2 — AI-Native Game IDE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <style>
      :root {
        --bg-deepest: #050110;
        --bg-base: #0a0618;
        --bg-elevated: #100b24;
        --bg-surface: #171133;
        --border-subtle: rgba(139, 92, 246, 0.15);
        --border-active: rgba(139, 92, 246, 0.35);
        --accent-primary: #8b5cf6;
        --accent-primary-hover: #7c3aed;
        --accent-blue: #38bdf8;
        --accent-green: #34d399;
        --accent-rose: #f43f5e;
        --accent-amber: #fbbf24;
        --text-primary: #f0eef6;
        --text-secondary: #9590a8;
        --text-tertiary: #65607a;
        --font-sans: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--bg-deepest);
        color: var(--text-primary);
        font-family: var(--font-sans);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-deepest);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-subtle);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--border-active);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
