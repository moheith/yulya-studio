name: Verification and Security Pipeline

on:
  push:
    branches: [ main, fix/v2-verification ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Security, Isolation & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx

      - name: Run Backend Test Suite
        env:
          ENVIRONMENT: test
          SESSION_SECRET: test_session_secret_with_sufficient_entropy_at_least_32_chars
        run: |
          python -m pytest tests/unit tests/integration -v

  frontend-tests:
    name: Frontend Build, Tokens & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Build Production Frontend Bundle
        working-directory: frontend
        run: npm run build

  e2e-browser-tests:
    name: Playwright End-to-End Browser Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build frontend for E2E
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Install Python & Playwright dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx playwright
          python -m playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        env:
          ENVIRONMENT: test
          SESSION_SECRET: test_session_secret_with_sufficient_entropy_at_least_32_chars
        run: |
          python -m pytest tests/e2e -v
